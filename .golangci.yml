version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gosimple
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    paths:
      - vendor

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
